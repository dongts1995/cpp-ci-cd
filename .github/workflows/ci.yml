name: C++ CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:

    strategy:
      fail-fast: false

      matrix:
        compiler:
          - name: gcc
            cc: gcc
            cxx: g++
          - name: clang
            cc: clang
            cxx: clang++

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
          key: ${{ runner.os }}-${{ matrix.compiler.name }}-cmake-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}

      - name: Build
        run: cmake --build build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.compiler.name }}
          path: build/


  test:

    needs: build

    strategy:
      fail-fast: false

      matrix:
        compiler:
          - gcc
          - clang

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.compiler }}
          path: build

      - name: Restore executable permission
        run: chmod +x build/unit_tests

      - name: Run tests
        run: ctest --test-dir build --output-on-failure


  quality:

    needs: build

    strategy:
      fail-fast: false

      matrix:
        compiler:
          - gcc
          - clang

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.compiler }}
          path: build

      - name: Check code formatting
        run: |
          find src include tests \
            -type f \
            \( -name "*.cpp" -o -name "*.h" \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Run clang-tidy
        run: |
          clang-tidy \
            -p build \
            src/Calculator.cpp


  gate:

    if: ${{ always() }}

    needs:
      - test
      - quality

    runs-on: ubuntu-latest

    steps:

      - name: CI Quality Gate
        run: echo "All CI checks passed!"

