name: C++ CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

jobs:

  build:

    strategy:
      fail-fast: false

      matrix:
        compiler:
          - name: gcc
            cc: gcc
            cxx: g++
          - name: clang
            cc: clang
            cxx: clang++

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
          key: ${{ runner.os }}-${{ matrix.compiler.name }}-cmake-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}

      - name: Build
        run: cmake --build build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.compiler.name }}
          path: build/


  test:

    needs: build

    strategy:
      fail-fast: false

      matrix:
        compiler:
          - gcc
          - clang

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.compiler }}
          path: build

      - name: Restore executable permission
        run: chmod +x build/unit_tests

      - name: Run tests
        run: ctest --test-dir build --output-on-failure


  quality:

    needs: build

    strategy:
      fail-fast: false

      matrix:
        compiler:
          - gcc
          - clang

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.compiler }}
          path: build

      - name: Check code formatting
        run: |
          find src include tests \
            -type f \
            \( -name "*.cpp" -o -name "*.h" \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Run clang-tidy
        run: |
          clang-tidy \
            -p build \
            src/Calculator.cpp


  gate:

    if: ${{ always() }}

    needs:
      - test
      - quality

    runs-on: ubuntu-latest

    steps:

      - name: Check CI results
        if: ${{ needs.test.result == 'success' && needs.quality.result == 'success' }}
        run: echo "All CI checks passed!"

      - name: Fail CI Gate
        if: ${{ needs.test.result != 'success' || needs.quality.result != 'success' }}
        run: |
          echo "CI checks failed."
          echo "Test result: ${{ needs.test.result }}"
          echo "Quality result: ${{ needs.quality.result }}"
          exit 1

  release-build-linux:

    if: startsWith(github.ref, 'refs/tags/v')

    needs: gate

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload Linux Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: build/cpp_ci_cd

  release-build-windows:

    if: startsWith(github.ref, 'refs/tags/v')

    needs: gate

    runs-on: windows-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload Windows Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: build/Release/cpp_ci_cd.exe

  package-linux:

    if: startsWith(github.ref, 'refs/tags/v')

    needs: release-build-linux

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Linux Release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: build

      - name: Package Linux
        run: |
          mkdir package
          cp build/cpp_ci_cd package/
          cp README.md package/
          tar -czf cpp-ci-cd-linux-${{ github.ref_name }}.tar.gz package

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: cpp-ci-cd-linux-*.tar.gz

  package-windows:

    if: startsWith(github.ref, 'refs/tags/v')

    needs: release-build-windows

    runs-on: windows-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Windows Release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: build

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item build/cpp_ci_cd.exe package/
          Copy-Item README.md package/
          Compress-Archive `
            -Path package/* `
            -DestinationPath cpp-ci-cd-windows-${{ github.ref_name }}.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: cpp-ci-cd-windows-*.zip

  create-release:

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - package-linux
      - package-windows

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: package-linux
          path: artifacts/linux

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: package-windows
          path: artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/*
            artifacts/windows/*
          generate_release_notes: true

