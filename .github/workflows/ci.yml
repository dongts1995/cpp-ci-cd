name: C++ CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check code formatting
        if: runner.os == 'Linux'
        run: |
          find src include tests \
            -type f \
            \( -name "*.cpp" -o -name "*.h" \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Run clang-tidy
        if: runner.os == 'Linux'
        run: |
          clang-tidy \
            -p build \
            src/Calculator.cpp