name: Release

on:
  push:
    tags:
      - 'v*'

jobs:

  build-linux:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Package Linux
        run: |
          mkdir package
          cp build/cpp_ci_cd package/
          cp README.md package/
          tar -czf cpp-ci-cd-linux-${{ github.ref_name }}.tar.gz package

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-ci-cd-linux
          path: cpp-ci-cd-linux-*.tar.gz


  build-windows:

    runs-on: windows-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item build/Release/cpp_ci_cd.exe package/
          Copy-Item README.md package/
          Compress-Archive `
            -Path package/* `
            -DestinationPath cpp-ci-cd-windows-${{ github.ref_name }}.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-ci-cd-windows
          path: cpp-ci-cd-windows-*.zip


  create-release:

    needs:
      - build-linux
      - build-windows

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: cpp-ci-cd-linux
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cpp-ci-cd-windows
          path: artifacts/windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/*
            artifacts/windows/*
          generate_release_notes: true